# Автоматично оновлює Cloudflare Worker після змін у lampa-uakino.
# Потрібні секрети репозиторію CLOUDFLARE_API_TOKEN і CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions). Без них крок деплою пропускається.
name: uakino worker

on:
  push:
    paths:
      - 'lampa-uakino/**'
      - '.github/workflows/uakino-worker.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: lampa-uakino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/test.js
      - name: Deploy to Cloudflare Workers
        if: ${{ github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@3.114.0 deploy
